<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game 9x9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎮 SUDOKU 9x9 🎮</h1>
        <div id="status" class="status">Click ô trống để chọn, sau đó click số 1-9!</div>
        <div id="sudoku-board" class="sudoku-board"></div>
        <div class="number-pad" id="number-pad"></div>
        <button class="new-game-btn" onclick="generateNewPuzzle()">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
